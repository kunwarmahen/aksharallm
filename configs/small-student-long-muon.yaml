# Optimizer experiment at ~100M over the LONG budget (docs/05 § "Muon"): configs/small-
# student-long.yaml exactly, with `optim.name: muon`. small-student-muon beat small-student by
# 3.1% at 2,000 steps (2026-11-20); this asks whether the lead holds over 5,800, against the
# matched-compute AdamW arm small-student-long (val 3.0616, prose 3.301, Python 1.812).
#
#   scripts/experiment.sh small-student-long-muon
#   python -m aksharallm.eval domains small-student-long-muon
#   python -m aksharallm.eval small-student-long-muon --suite fast

name: small-student-long-muon

model:
  vocab_size: 32768       # the blend tokenizer -- the teacher's, which distillation requires
  d_model: 768            # small-code is 1024 x 24 (300M); this is ~101M, 3x smaller
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  max_seq_len: 1024
  tie_embeddings: true
  dropout: 0.0

data:
  val_bin: data/blend/val.bin
  tokenizer: data/blend/tokenizer.json
  train_sources:
    - {bin: data/blend/fineweb-edu-10bt.bin, weight: 0.85}
    - {bin: data/blend/codeparrot-python.bin, weight: 0.15}

optim:
  lr: 6.0e-4              # a 3x smaller model takes a higher LR than the 300M's 3e-4
  min_lr_ratio: 0.1
  warmup_steps: 300
  weight_decay: 0.1
  name: muon              # the ONE line that differs from small-student-long (the control)
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/small-student-long-muon
  batch_size: 16
  grad_accum: 15          # 16 * 15 * 1024 = 245,760 tokens/step, as small-code
  seq_len: 1024
  max_steps: 5800         # 2,000 x 2.9: the distilled arm measured 10.2 s/step against 3.5 (2026-11-01), so this is the same GPU time
  eval_every: 500
  eval_batches: 50
  sample_every: 1000
  ckpt_every: 250
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
