# The recogniser on 460 h: train-clean-100 + train-clean-360 (1,172 speakers instead of 251).
# The ONLY change from asr-libri100.yaml is the data (and a step budget sized to it), so the
# difference between the two runs is what 4.6x more speech buys — measured on test-clean,
# test-other, the real-noise test and your own voice (docs/23 § "More speech").
#
# Get the data first (23 GB download, ~42 GB packed — delete the archive after extracting):
#     .venv/bin/python -m aksharallm.asr fetch train-clean-360
#     .venv/bin/python -m aksharallm.asr pack  train-clean-360
# Then:
#     scripts/audio.sh asr-libri460            # stop/resume like every other run
#
# Budget: 120,000 steps x ~400 s of audio = ~29 passes over 460 h (asr-libri100 made ~66 over
# its 100 h). At the ~0.28 s/step asr-libri100 ran at, that is ~9-10 h on the 3090 — several
# evenings with stop/resume. Unload any resident Ollama model first (it can hold 18.5 GB).
name: asr-libri460

asr:
  d_model: 256
  n_layers: 12
  n_heads: 4
  ff_mult: 4
  conv_kernel: 31
  subsample_channels: 256
  dropout: 0.1
  normalise: global        # see asr/model.py `normalise` for why not per-utterance

data:
  train: [data/asr/train-clean-100, data/asr/train-clean-360]
  val: data/asr/dev-clean
  min_seconds: 0.5
  max_seconds: 17.0        # the same cut as asr-libri100, so the data change is only more speech
  max_batch_seconds: 400.0 # padded audio per step; memory follows this, not utterances
  eval_utts: 400
  no_speech_ratio: 0.05

augment:
  enabled: true
  gain_db: [-18.0, 6.0]
  freq_masks: 2
  freq_width: 27
  time_masks: 5
  time_ratio: 0.05

optim:
  lr: 1.0e-3
  min_lr_ratio: 0.02
  warmup_steps: 5000       # Conformers diverge without a long warmup
  weight_decay: 1.0e-3
  beta1: 0.9
  beta2: 0.98
  grad_clip: 5.0
  schedule: cosine

train:
  out_dir: checkpoints/asr-libri460
  max_steps: 120000        # ~29 passes over 460 h at ~400 s per step
  eval_every: 1000
  ckpt_every: 1000
  log_every: 50
  ctc_impl: torch          # identical to ours (tested); ours costs 3.2x per step on the card
