# Associative recall, the all-DeltaNet (no attention, no positions) arm (docs/04 § "Does the memory remember?"). Three configs,
# one model key apart (recall-dense / recall-hybrid / recall-deltanet), trained on documents
# that are all retrieval: pairs (key value), a gap of filler, then queries whose values can
# only be found by looking the key up (aksharallm/longctx/recall.py). Scored by
# `longctx recall`, past the 512-token training window as well as inside it.
#
#   python -m aksharallm.longctx recall-data          # ~1 min, CPU -> data/recall
#   scripts/experiment.sh recall-deltanet
#   python -m aksharallm.longctx recall recall-deltanet --device cuda

name: recall-deltanet

model:
  vocab_size: 148         # 3 specials + '?' + 64 keys + 64 values + 16 filler (longctx/recall.py)
  d_model: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 6           # == n_heads, i.e. plain MHA. GQA isn't worth it at this size.
  max_seq_len: 512
  tie_embeddings: true
  dropout: 0.0
  full_attn_every: 7       # > n_layers: no block is attention, all six are DeltaNet

data:
  train_bin: data/recall/train.bin
  val_bin: data/recall/val.bin
  tokenizer: data/recall/tokenizer.json

optim:
  lr: 1.0e-3              # small models tolerate (and want) a high LR
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine
  name: adamw

train:
  out_dir: checkpoints/recall-deltanet
  batch_size: 48
  grad_accum: 2           # 48 * 2 * 512 = 49,152 tokens/step
  seq_len: 512
  max_steps: 8000         # 393M tokens: ~1.6 passes over data/recall (240M); retrieval forms late
  eval_every: 500
  eval_batches: 40
  sample_every: 0         # a text prompt means nothing here; `longctx recall` is the sample
  ckpt_every: 1000
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
