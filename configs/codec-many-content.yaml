# codec-many with a content codebook (docs/21 § "A content codebook"): identical except for
# the two `loss.content_*` keys, so the pair answers one question -- does pulling codebook 0
# towards our own recogniser's encoder put the words there and leave the voice to the rest?
#
#     scripts/audio.sh codec-many-content
#     python -m aksharallm.audio codec-transfer checkpoints/codec-many-content/ckpt_best.pt --cpu
#
# The teacher is frozen asr-libri460. It costs one recogniser forward per step (no backward).
name: codec-many-content

codec:
  sample_rate: 16000
  channels: 32
  strides: [2, 4, 5, 8]
  dim: 128
  n_codebooks: 8
  codebook_size: 1024
  n_residual: 2
  dilations: [1, 3]
  restart_after: 200
  quantizer_dropout: true

data:
  window_seconds: 1.0
  val_clips: 64
  sources:
    - {corpus: data/audio/lj, weight: 0.20}
    - {corpus: data/asr/train-clean-100, weight: 0.17}
    - {corpus: data/asr/train-clean-360, weight: 0.63}

optim:
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.0
  beta2: 0.99
  grad_clip: 1.0
  schedule: cosine

loss:
  scales: [2048, 1024, 512, 256, 128]
  log_weight: 1.0
  convergence_weight: 1.0
  wave_weight: 0.1
  vq_weight: 1.0
  content_weight: 1.0       # 1 - cos is in [0, 2]; recon starts near 3-5, so this is a nudge, not the objective
  content_teacher: checkpoints/asr-libri460/ckpt_best.pt

train:
  out_dir: checkpoints/codec-many-content
  init: checkpoints/codec-lj/ckpt_best.pt
  batch_size: 16
  max_steps: 100000
  eval_every: 1000
  eval_batches: 25
  sample_every: 2000
  sample_seconds: 4.0
  ckpt_every: 2000
  log_every: 50
