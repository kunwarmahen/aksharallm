# G1 of the picture line (docs/26 § "From a sentence to a picture"): a transformer reads
# "two red circles" and writes the picture's codes, which imgtok-shapes's decoder paints.
# Trained with 10% of captions dropped so classifier-free guidance can push the drawing
# towards the caption. Scored by the rule-based reader on all 60 captions, including the four
# purple-triangle ones no training picture shows.
#
#   python -m aksharallm.pictures codes imgtok-shapes --books 2     # data/pictures/codes-imgtok-shapes
#   scripts/audio.sh imggen-shapes                                  # the non-text launcher
#   python -m aksharallm.pictures gen-report imggen-shapes --guidance 3
#   python -m aksharallm.pictures draw imggen-shapes "two red circles"

name: imggen-shapes

picgen:
  tokenizer: checkpoints/imgtok-shapes/ckpt_best.pt
  books: 2            # 2 x 64 cells = 128 codes a picture (1 book misses 5% of held-out colours)
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  cfg_drop: 0.1

data:
  codes: data/pictures/codes-imgtok-shapes

optim:
  lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 300
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/imggen-shapes
  batch_size: 64
  max_steps: 8000
  eval_every: 500
  eval_batches: 8
  sample_every: 2000
  sample_k: 2
  sample_guidance: 3.0
  ckpt_every: 1000
  log_every: 50
  seed: 1337
  resume: auto
