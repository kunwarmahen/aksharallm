# Hybrid linear attention at 13.8M (docs/04 § "Linear attention"): configs/tiny-adamw.yaml
# exactly, with `model.full_attn_every: 3`. Blocks 2 and 5 keep softmax attention; blocks 0,
# 1, 3 and 4 become Gated DeltaNet layers (model/deltanet.py), whose memory is a fixed
# 64x64 matrix per head instead of a cache that grows with the context. 14.39M parameters
# against 13.77M (the DeltaNet layer has full-width k/v, an output gate and a short conv).
#
# The control is tiny-adamw (val 1.4752 at 8,000 steps, 2026-11-19): same seed, so the same
# batches (gotcha 16), same optimizer and schedule. Two questions:
#   * val loss at matched steps, and at matched wall clock (a hybrid step is ~1.8x here:
#     the chunked recurrence is plain PyTorch, not a fused kernel);
#   * loss by position PAST the trained 512 (`longctx curve`): four of six blocks have no
#     positions at all, so does it degrade less beyond its window than tiny-adamw does?
#
#   scripts/experiment.sh tiny-hybrid
#   python -m aksharallm.longctx curve checkpoints/tiny-hybrid/ckpt_best.pt --len 1024 --windows 32

name: tiny-hybrid

model:
  vocab_size: 8192        # must match the tokenizer
  d_model: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 6           # == n_heads, i.e. plain MHA. GQA isn't worth it at this size.
  max_seq_len: 512
  tie_embeddings: true
  dropout: 0.0
  full_attn_every: 3       # the ONE model key that differs from tiny-adamw

data:
  train_bin: data/tinystories/train.bin
  val_bin: data/tinystories/val.bin
  tokenizer: data/tinystories/tokenizer.json

optim:
  lr: 1.0e-3              # small models tolerate (and want) a high LR
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine
  name: adamw

train:
  out_dir: checkpoints/tiny-hybrid
  batch_size: 48
  grad_accum: 2           # 48 * 2 * 512 = 49,152 tokens/step
  seq_len: 512
  max_steps: 8000         # ~393M tokens ~= 1 epoch of our 400M-token corpus
  eval_every: 500
  eval_batches: 40
  sample_every: 1000
  ckpt_every: 1000
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
