# The many-voices codec (docs/21 § "Does the codec carry other voices?"): codec-lj's exact
# architecture, warm-started from its weights, trained on LJSpeech + LibriSpeech 460 h.
#
# Why: codec-lj reconstructs its own voice at MCD 2.53 dB and forty LibriSpeech voices at
# 9.12, and decoding without any rounding is no better (9.49), so the encoder and decoder
# themselves have to learn new voices, not only the codebooks.
#
#     scripts/audio.sh codec-many
#     python -m aksharallm.audio codec-transfer checkpoints/codec-many/ckpt_best.pt --cpu
#
# The gate before any TTS is built on it: codec-transfer's LibriSpeech row improves and its
# LJSpeech row does not get worse (paired per clip). Watch `book` from step one as always.
name: codec-many

codec:
  sample_rate: 16000
  channels: 32
  strides: [2, 4, 5, 8]
  dim: 128
  n_codebooks: 8
  codebook_size: 1024
  n_residual: 2
  dilations: [1, 3]
  restart_after: 200
  quantizer_dropout: true

data:
  window_seconds: 1.0
  val_clips: 64
  # LJ keeps a fifth of every batch so the voice it already knows does not drift; LibriSpeech
  # splits the rest by hours (100 : 364). Each corpus is also scored on its own val tail.
  sources:
    - {corpus: data/audio/lj, weight: 0.20}
    - {corpus: data/asr/train-clean-100, weight: 0.17}
    - {corpus: data/asr/train-clean-360, weight: 0.63}

optim:
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000        # re-warm: the Adam moments are fresh even though the weights are not
  weight_decay: 0.0
  beta2: 0.99
  grad_clip: 1.0
  schedule: cosine

loss:
  scales: [2048, 1024, 512, 256, 128]
  log_weight: 1.0
  convergence_weight: 1.0
  wave_weight: 0.1
  vq_weight: 1.0

train:
  out_dir: checkpoints/codec-many
  init: checkpoints/codec-lj/ckpt_best.pt
  batch_size: 16
  max_steps: 100000         # ~2.7 h at codec-lj's 0.096 s/step
  eval_every: 1000
  eval_batches: 25
  sample_every: 2000
  sample_seconds: 4.0
  ckpt_every: 2000
  log_every: 50
