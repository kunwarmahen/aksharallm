# The real codec run: LJSpeech, 24 hours of one reader, ~a day on the 3090.
#
# One speaker is the right first target — it removes speaker identity as a variable, and the
# codec has enough to learn without also learning what different people sound like.
#
#     .venv/bin/python -m aksharallm.audio fetch ljspeech      # 2.6 GB download
#     .venv/bin/python -m aksharallm.audio pack data/audio/ljspeech/LJSpeech-1.1/wavs \
#         --out data/audio/lj                                  # ~2.7 GB, 22050 -> 16000 Hz
#     scripts/audio.sh codec-lj
#
# Watch `book` in the log from step one: codebook collapse is invisible in the loss curve
# and fatal to everything downstream. See docs/20-audio.md § "What goes wrong".
name: codec-lj

codec:
  sample_rate: 16000
  channels: 32              # -> widths 32/64/128/256/512, about 6.8M trainable
  strides: [2, 4, 5, 8]     # 50 frames/s
  dim: 128
  n_codebooks: 8
  codebook_size: 1024       # 10 bits x 8 x 50 = 4.0 kbps, against 256 kbps of PCM
  n_residual: 2
  dilations: [1, 3]
  restart_after: 200
  quantizer_dropout: true   # so 1, 2 and 4 codebooks are usable, not just 8

data:
  corpus: data/audio/lj
  window_seconds: 1.0
  val_clips: 64

optim:
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.0
  beta2: 0.99
  grad_clip: 1.0
  schedule: cosine

loss:
  scales: [2048, 1024, 512, 256, 128]
  log_weight: 1.0
  convergence_weight: 1.0
  wave_weight: 0.1
  vq_weight: 1.0

train:
  out_dir: checkpoints/codec-lj
  batch_size: 16
  max_steps: 150000
  eval_every: 1000
  eval_batches: 25
  sample_every: 2000        # the setting that actually tells you how it is going
  sample_seconds: 4.0
  ckpt_every: 2000
  log_every: 50
