# Optimizer experiment at ~100M, the MUON arm (docs/05 § "Muon"): configs/small-student.yaml
# exactly, with `optim.name: muon`. The control already exists: small-student trained
# 2026-11-02 (val 4.211 / 3.646 / 3.451 / 3.371 at 500 / 1000 / 1500 / 1999), seeded, on
# the same blend, so only this arm needs the card (~2 h). tiny-muon beat tiny-adamw by 2.3%
# (2026-11-19); a lead at 13.8M has not always survived this jump (docs/24), hence this run.
#
#   scripts/experiment.sh small-student-muon
#   python -m aksharallm.eval domains small-student-muon     # vs small-student's 3.616 / 2.138
#   python -m aksharallm.eval small-student-muon --suite fast

name: small-student-muon

model:
  vocab_size: 32768       # the blend tokenizer -- the teacher's, which distillation requires
  d_model: 768            # small-code is 1024 x 24 (300M); this is ~101M, 3x smaller
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  max_seq_len: 1024
  tie_embeddings: true
  dropout: 0.0

data:
  val_bin: data/blend/val.bin
  tokenizer: data/blend/tokenizer.json
  train_sources:
    - {bin: data/blend/fineweb-edu-10bt.bin, weight: 0.85}
    - {bin: data/blend/codeparrot-python.bin, weight: 0.15}

optim:
  lr: 6.0e-4              # a 3x smaller model takes a higher LR than the 300M's 3e-4
  min_lr_ratio: 0.1
  warmup_steps: 300
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine
  name: muon              # the ONE line that differs from small-student (the control)

train:
  out_dir: checkpoints/small-student-muon
  batch_size: 16
  grad_accum: 15          # 16 * 15 * 1024 = 245,760 tokens/step, as small-code
  seq_len: 1024
  max_steps: 2000         # ~492M tokens, ~5 per parameter: the undertrained regime a teacher should help most
  eval_every: 500
  eval_batches: 50
  sample_every: 1000
  ckpt_every: 250
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
