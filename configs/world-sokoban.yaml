# A toy world model (docs/25): the same transformer, predicting the next FRAME of a game we
# wrote (push boxes onto goals, aksharallm/world/game.py) from the frames before it and the
# action taken. A frame is 64 cell tokens and an action is one more, so the vocabulary is 15
# words and the pretraining loop is unchanged: `python -m aksharallm.world prepare` writes
# data/world/{train,val}.bin + tokenizer.json, and this config trains on them.
#
# Shape: tiny's (d 384, 6 layers), ~10.7M parameters, almost none of them embeddings.
# 4,000 steps x 49,152 tokens = ~197M tokens, 1.6 passes over 60,000 random games.
#
#   python -m aksharallm.world prepare                 # ~1 min, CPU, ~242 MB
#   scripts/experiment.sh world-sokoban                # ~10 min on a 3090
#   python -m aksharallm.world eval checkpoints/world-sokoban/ckpt_best.pt
#   python -m aksharallm.world play checkpoints/world-sokoban/ckpt_best.pt

name: world-sokoban

model:
  vocab_size: 15          # 3 specials + 7 cells + 5 actions (world/data.py VOCAB)
  d_model: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 6           # == n_heads, i.e. plain MHA. GQA isn't worth it at this size.
  max_seq_len: 512
  tie_embeddings: true
  dropout: 0.0

data:
  train_bin: data/world/train.bin
  val_bin: data/world/val.bin
  tokenizer: data/world/tokenizer.json

optim:
  lr: 1.0e-3              # small models tolerate (and want) a high LR
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/world-sokoban
  batch_size: 48
  grad_accum: 2           # 48 * 2 * 512 = 49,152 tokens/step
  seq_len: 512
  max_steps: 4000
  eval_every: 500
  eval_batches: 40
  sample_every: 0         # a text prompt means nothing here; `world play` is the sample
  ckpt_every: 1000
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
