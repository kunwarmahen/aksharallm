# The portal itself, not a training run.
#
# Two sections, for the portal's two non-dashboard tabs:
#   explain:  the Code tab — hands a file and the lines you highlighted to a local Ollama
#             model and asks it to explain them.
#   infer:    the Playground tab — loads one of your own checkpoints and generates from it.
# Nothing here affects training.
#
# The model runs on Ollama, on this machine. Start it with `ollama serve` (or the desktop
# app) and pull a model once:
#
#     ollama pull gemma4:12b
#
# Anything below can be overridden without editing this file:
#     AKSHARALLM_OLLAMA_HOST=http://192.168.1.9:11434  # a model on another box
#     AKSHARALLM_EXPLAIN_MODEL=qwen3.5:27b
# and the Code tab's model picker overrides it again, per request.

explain:
  host: http://127.0.0.1:11434
  model: gemma4:12b

  # Low, on purpose: this is an explanation of code that already exists, not a brainstorm.
  temperature: 0.2

  # Let a reasoning model think before answering? Off, and not for taste: a thinking model
  # spends `num_predict` on its reasoning *first*, so with thinking on and a budget of 800
  # you reliably get a complete train of thought and a completely empty answer. gemma4:12b
  # does exactly this. Turn it on only if you also raise num_predict a long way.
  # Models that have never heard of the setting ignore it — the request is retried without.
  think: false

  # The context window Ollama allocates. Every 1k of context is real VRAM, and the card is
  # usually busy training — that is why this is 8k and not the model's maximum.
  num_ctx: 8192
  num_predict: 800

  # THE ONE THAT MATTERS WHILE TRAINING. How many layers Ollama may put on the GPU.
  # Unset (the default) means "all of them, if they fit" — about 8 GB for a 12B model. A
  # Phase-2 run already holds ~21 GB of a 24 GB card, so asking a question mid-run can push
  # the trainer into an out-of-memory death several days in. Set this to 0 to keep the
  # explainer entirely on the CPU: it cannot touch the run, but be realistic about the cost
  # — a 12B model reading a real file took over three minutes to produce its first word on
  # this machine, against ~15 seconds on the card. Pair it with a much smaller model
  # (`model: starcoder2:3b`) if you want to read while a long run is going. The Code tab
  # says which of the two you are in.
  #   num_gpu: 0
  # Per session instead:  AKSHARALLM_EXPLAIN_NUM_GPU=0

  # How long Ollama keeps the model resident after an answer. Short, so ~8 GB of VRAM goes
  # back to the trainer a few minutes after you stop reading. "0" unloads immediately.
  keep_alive: 5m

  # A whole file is sent as context. Past this many characters the file is windowed around
  # your selection instead, so a 1500-line module still fits with room for the answer.
  max_file_chars: 12000

  # Seconds to wait for the first byte, and how many follow-up turns to carry.
  timeout_s: 300
  max_history: 12

# --------------------------------------------------------------------------------------
# The LLM-judge, for the eval harness's `judge` suite.
#
# This is the same Ollama client as `explain:` above, reading a different section — one
# implementation, one set of error messages, two callers. The defaults differ because the
# two want opposite things: the explainer wants a model small enough to run beside a
# training run and answer while you wait, the judge wants the best model on the machine and
# does not mind taking a minute per answer.
#
# It grades twelve fixed open-ended prompts 1-5 against a written rubric. That is the only
# measurement in the harness that can see fluency, instruction-following and invented facts
# — the things multiple choice cannot measure and synthetic training data damages first.
#
#     python -m aksharallm.eval <ckpt> --suite judge
#     AKSHARALLM_JUDGE_MODEL=gemma4:31b        # for one session
# --------------------------------------------------------------------------------------

judge:
  # The biggest model you have pulled. A judge's job is to be a consistent reader, and a
  # bigger model is a more consistent one. It runs after the answers are generated, so it
  # never competes with our own model for memory.
  model: qwen3.5:27b

  # Zero, and not for taste: a judge that samples gives a different grade to the same
  # answer on a second run, which destroys the only thing the number is good for —
  # comparing one of our checkpoints against another.
  temperature: 0.0

  # Same trap as the explainer: a reasoning model spends `num_predict` on its thinking
  # before answering, and the reply we need is a one-line JSON object. See docs/08.
  think: false

  num_ctx: 8192
  num_predict: 400

  # Longer than the explainer's. Nobody is watching this one arrive, and a 27B model on a
  # busy machine can take a while per answer. Twelve answers is the whole suite.
  timeout_s: 600
  keep_alive: 5m

  # As with explain: 0 keeps the judge entirely on the CPU, which is what you want if you
  # run the judge suite while a training session is going. It will be slow.
  #   num_gpu: 0

# --------------------------------------------------------------------------------------
# The Synth tab: making training data with a local teacher.
#
# The third caller of the same Ollama client, reading a third section. What it wants is
# different again: the explainer wants speed, the judge wants consistency, and this wants
# DIVERSITY — the same prompt answered 5,000 times at temperature 0.2 is a dataset with
# 5,000 rows and about forty distinct ideas in it.
#
# The teacher is chosen per recipe, because "the best model for writing Python exercises"
# and "the best model for writing instruction data" are not the same model and the gap is
# an order of magnitude in quality-per-hour, in both directions.
#
#     python -m aksharallm.synth recipes
#     python -m aksharallm.synth gen python --name py-v1 --n 200
#     AKSHARALLM_SYNTH_MODEL_PYTHON=starcoder2:3b      # for one session
# --------------------------------------------------------------------------------------

synth:
  # High, and not for taste — see above. The seed grid does most of the work; a low
  # temperature would undo it.
  temperature: 0.9

  # Same trap as the other two sections: a reasoning model spends num_predict thinking and
  # returns an empty answer. See docs/08.
  think: false

  num_ctx: 8192

  # A whole exercise — problem, solution and tests — has to fit in this.
  num_predict: 1200

  # Longer than the explainer's: nobody is watching a generation run arrive.
  timeout_s: 600

  # Longer than elsewhere too. A generation run makes hundreds of calls back to back, and
  # reloading a 9 GB model between them would dominate the wall clock.
  keep_alive: 10m

  # THE ONE THAT MATTERS WHILE TRAINING. Unlike the Playground and the Quantize tab, this
  # cannot quietly fall back to the CPU: the model is loaded by Ollama, in another process,
  # and the only levers are which teacher is asked for and this. A 14B teacher beside a
  # Phase-2 run's ~21 GB of 24 can kill the run. Set 0 to keep the teacher on the CPU (slow
  # but harmless), or use starcoder2:3b, which genuinely fits alongside.
  #   num_gpu: 0

  # How often one seed may be re-asked after a format failure. Deliberately low: retrying
  # the same cell until it succeeds biases the dataset towards what the teacher finds easy.
  max_attempts: 2

  # Per recipe. Anything left out falls back to the built-in default for that recipe
  # (python: qwen2.5:14b, chat and preference: gemma4:31b).
  recipes:
    python:
      model: qwen2.5:14b
    chat:
      model: gemma4:31b
    preference:
      model: gemma4:31b
      # Lower than the section default: a preference pair needs the *flaw* to be the one
      # asked for, and a very high temperature makes the bad answer bad in three ways at
      # once, which teaches DPO the wrong difference.
      temperature: 0.7

# --------------------------------------------------------------------------------------
# The Playground tab: testing your own checkpoints.
#
# This is the other model in the building — not the Ollama one that reads your code, but
# the one you are training. Point it at a checkpoint and it generates: prose completion,
# chat (once Phase 3 has produced an SFT'd model), and Python that is actually executed
# against tests.
#
# Overridable for one session without editing this file:
#     AKSHARALLM_INFER_DEVICE=cpu
# --------------------------------------------------------------------------------------

infer:
  # THE ONE THAT MATTERS WHILE TRAINING. Where the checkpoint is loaded.
  #
  #   auto  (default) the GPU — unless a run is training on this card, in which case the
  #         CPU, automatically, and the tab says why. Also falls back to the CPU if less
  #         than 2 GB of VRAM is free, which catches an Ollama model the Code tab left
  #         resident.
  #   cuda  always the GPU. A 300M model in bf16 is only ~0.7 GB with its KV cache, so it
  #         does fit alongside a Phase-2 run's ~21 GB — but a CUDA context is half a
  #         gigabyte before any weights land, and the failure mode is not a slow tab, it is
  #         a six-day run dying overnight at step 22,000. Choose this deliberately.
  #   cpu   never the GPU. Safe, and slower: measure it before relying on it — a 13M model
  #         does ~180 tok/s on this machine, a 300M one is a few tokens a second.
  device: auto

  # Seconds of no generations before the model is unloaded and its memory handed back.
  # Same idea as `explain.keep_alive` above: the card should not stay occupied because you
  # opened a tab an hour ago. Reloading costs a few seconds off disk.
  idle_unload_s: 300

  # Seconds to wait for the model when another generation is already running. One at a
  # time: two concurrent generations each allocate their own KV cache and halve each
  # other's speed for no benefit.
  busy_wait_s: 2

  # The system prompt for chat mode. Ignored by a base model, which has never seen one.
  system: You are a helpful assistant.

  sampling:
    max_new_tokens: 256
    # 0.8 with nucleus sampling is roughly what the model "feels" like. Set temperature to
    # 0 for greedy decoding when you want two checkpoints to be comparable.
    temperature: 0.8
    top_k: 50
    top_p: 0.95
    # Deliberately 1.0 (off). A penalty above 1 hides degenerate looping, which is exactly
    # the symptom that tells you a base model is undertrained — see the `repetition` probe.
    repetition_penalty: 1.0

  # RUNNING CODE THE MODEL WROTE. The Python tasks are graded by executing the generated
  # function against asserts, in a subprocess with a CPU-time limit, a memory limit, no
  # access to this project's code and a throwaway working directory. Read the docstring of
  # aksharallm/infer/sandbox.py before changing this — it is honest about what the
  # containment is and, more importantly, what it is not.
  # Set false to generate the code and show it without ever running it.
  run_tests: true
  sandbox_timeout_s: 10
  sandbox_memory_mb: 512

  # Generations kept in logs/playground.jsonl, each stamped with the step, validation loss
  # and tokens seen of the checkpoint that produced it. This is why checkpoints are not
  # archived: a text record of what the model said at step 7,000 is a kilobyte and
  # permanent, where a copy of the weights is 1.2 GB and would be one of forty.
  history_max: 2000

  # Longest prompt accepted over HTTP. The real limit is the model's context window.
  max_prompt_chars: 20000

# --------------------------------------------------------------------------------------
# What a run costs to produce.
#
# The GPU sampler already records the card's power draw every five seconds, tagged with
# whichever run or job was using it, and folds it into logs/energy.jsonl — a permanent
# ledger, because logs/gpu.jsonl is a rolling buffer and a total that quietly shrinks as
# old samples are trimmed is worse than no total. This section is the only missing piece:
# what a unit of that energy costs you.
#
# Nothing here is set by default, and an unset rate is reported as unset — the portal shows
# kWh and hours and says so, rather than inventing a price. Fill in `per_kwh` from your
# electricity bill and every run gains a number.
#
#     python -m aksharallm.portal        # Cost card, in the dashboard's GPU panel
#     AKSHARALLM_COST_PER_KWH=8.0        # for one session, without editing this file
# --------------------------------------------------------------------------------------

cost:
  # Printed in front of every amount. A prefix, not a currency code.
  currency: "$"

  # What you pay for a kilowatt-hour. This is the honest one on a machine you own.
  per_kwh: 0.15

  # What an hour of this machine would cost *rented*, for the comparison against a cloud
  # quote. If both are set they are added: they answer different questions, and neither is
  # a correction of the other. Set only this one if you have no idea what power costs and
  # just want "what would these 60 hours have cost on somebody else's A100".
  #   per_hour: 1.20

  # THE ONE THAT MAKES THE NUMBER MATCH A PLUG METER. nvidia-smi measures the *card*, and
  # the card is not the machine: CPU, drives, fans and anything else plugged into the same
  # socket draw their own 60-120 W, and the PSU wastes ~10% of the total as heat on the way
  # in. Left at 0 and 1.0, the report says "GPU card only — the wall socket draws more",
  # which is true and is roughly 30% under what you are billed for.
  #   host_watts: 100
  #   psu_efficiency: 0.9
