# Phase 1: the "hello world" run.
# ~30M params on TinyStories. Proves the whole pipeline works before we spend days of
# GPU time. Should reach val loss ~1.2-1.4 and generate coherent little stories.

name: tiny

model:
  vocab_size: 8192        # must match the tokenizer
  d_model: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 6           # == n_heads, i.e. plain MHA. GQA isn't worth it at this size.
  max_seq_len: 512
  tie_embeddings: true
  dropout: 0.0

data:
  train_bin: data/tinystories/train.bin
  val_bin: data/tinystories/val.bin
  tokenizer: data/tinystories/tokenizer.json

optim:
  lr: 1.0e-3              # small models tolerate (and want) a high LR
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/tiny
  batch_size: 48
  grad_accum: 2           # 48 * 2 * 512 = 49,152 tokens/step
  seq_len: 512
  max_steps: 8000         # ~393M tokens ~= 1 epoch of our 400M-token corpus
  eval_every: 500
  eval_batches: 40
  sample_every: 1000
  ckpt_every: 1000
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
