# Distillation experiment, the CONTROL arm (docs/24): a ~5M student trained from scratch on
# TinyStories. configs/tiny-distil.yaml is identical except for its `distil:` block, so the
# difference between the two runs is the teacher and nothing else -- same data, same seed
# (so the same batches, gotcha 16), same schedule, same steps.
#
#   scripts/experiment.sh tiny-student
#   scripts/experiment.sh tiny-distil
# then compare their val losses directly: both report the student's plain cross-entropy.

name: tiny-student

model:
  vocab_size: 8192        # the TinyStories tokenizer -- the teacher's, which distillation requires
  d_model: 256            # tiny is 384 x 6 layers (13.8M); this is ~5.2M, 2.6x smaller
  n_layers: 4
  n_heads: 4
  n_kv_heads: 4
  max_seq_len: 512
  tie_embeddings: true
  dropout: 0.0

data:
  train_bin: data/tinystories/train.bin
  val_bin: data/tinystories/val.bin
  tokenizer: data/tinystories/tokenizer.json

optim:
  lr: 1.0e-3
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/tiny-student
  batch_size: 48
  grad_accum: 2           # 49,152 tokens/step, as tiny
  seq_len: 512
  max_steps: 8000         # ~393M tokens, as tiny
  eval_every: 500
  eval_batches: 40
  sample_every: 1000
  ckpt_every: 1000
  log_every: 20
  compile: true
  seed: 1337
  wandb_project: null
  resume: auto
