# G4a (docs/26 § "G4a: reading a sentence"): G3b's flow model on the continuous latent, with
# the caption read by a FROZEN text model of our own (tiny, the 13.8M TinyStories model)
# instead of three fixed words. Trained on ten phrasings of every caption (pictures/phrases.py);
# scored on those, on two phrasings it never saw, and on the never-seen purple triangles.
# One block apart from flow-ae-shapes: the text keys.
#
#   scripts/audio.sh flow-text-shapes
#   python -m aksharallm.pictures gen-report flow-text-shapes --guidance 1 --k 32 --phrasings all

name: flow-text-shapes

flow:
  space: latent           # the tokenizer's latent, not pixels
  image_size: 8           # set from the latents' shape at launch (8x8x8)
  channels: 8
  patch: 1                # one token per latent cell: 64 tokens
  d_model: 384
  n_layers: 8
  n_heads: 6
  dropout: 0.0
  cfg_drop: 0.1
  sample_steps: 50
  tokenizer: checkpoints/ae-shapes/ckpt_best.pt       # the continuous autoencoder: wrote the latents, decodes
  score_tokenizer: checkpoints/imgtok-shapes/ckpt_best.pt   # VQ codes for the copy check only
  books: 2
  text: checkpoints/tiny/ckpt_best.pt            # the frozen text model that reads the caption
  text_tokenizer: data/tinystories/tokenizer.json
  text_len: 12                                     # the longest phrasing is 10 tokens

data:
  corpus: data/vision/shapes64k
  latents: data/pictures/latents-ae-shapes-64k
  codes: data/pictures/codes-imgtok-shapes-64k

optim:
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.99
  grad_clip: 1.0
  schedule: cosine

train:
  out_dir: checkpoints/flow-text-shapes
  batch_size: 64
  max_steps: 30000
  eval_every: 1000
  eval_batches: 8
  sample_every: 5000
  sample_k: 2
  sample_guidance: 3.0
  ckpt_every: 2000
  log_every: 50
  seed: 1337
  resume: auto
