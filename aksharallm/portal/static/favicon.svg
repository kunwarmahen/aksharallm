<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="aksharallm">
  <!-- aksharallm: "akshara" = letter/character. A letter, plus an amber dot — the next
       token being generated. Self-contained, no external fonts required for the shapes;
       the "a" uses a serif stack that every system provides a fallback for. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a93ea"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sheen)"/>
  <text x="27" y="46" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" fill="#ffffff">a</text>
  <circle cx="47" cy="41" r="5" fill="#f2a63b"/>
</svg>
