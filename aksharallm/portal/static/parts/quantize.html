<!-- The Quantize tab: make a trained model smaller, and see exactly what it cost. Every
     button here shells out to `python -m aksharallm.quant`, so a job started in the
     browser and one started in a terminal produce identical artifacts. -->
<div id="view-quant" class="view" hidden>
  <section class="quant-layout">

    <aside class="panel quant-form">
      <div class="panel-head">
        <h2>Quantize</h2>
        <span class="panel-note">int8 / int4, from scratch</span>
      </div>

      <label class="field wide">
        <span class="field-label">checkpoint</span>
        <select id="q-ckpt" aria-label="checkpoint"></select>
      </label>
      <div class="q-hint" id="q-ckpt-note"></div>

      <label class="field wide">
        <span class="field-label">method</span>
        <select id="q-method" aria-label="method"></select>
      </label>
      <div class="q-hint" id="q-method-note"></div>

      <div class="q-row">
        <label class="field">
          <span class="field-label">bits</span>
          <select id="q-bits" aria-label="bits">
            <option value="4" selected>4</option>
            <option value="8">8</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">group</span>
          <select id="q-group" aria-label="group size"></select>
        </label>
      </div>
      <div class="q-hint" id="q-group-note"></div>

      <label class="field wide" id="q-steps-field" hidden>
        <span class="field-label">QAT steps</span>
        <input id="q-steps" type="number" min="50" max="20000" step="50" value="800">
      </label>

      <label class="field wide">
        <span class="field-label">device</span>
        <select id="q-device" aria-label="device">
          <option value="">auto</option>
          <option value="cuda">cuda</option>
          <option value="cpu">cpu</option>
        </select>
      </label>
      <div class="q-hint" id="q-device-note"></div>

      <div class="q-checks">
        <label class="q-check"><input type="checkbox" id="q-bench" checked>
          <span>measure perplexity + speed <em>(slower, but a size with no perplexity beside it means nothing)</em></span></label>
        <label class="q-check"><input type="checkbox" id="q-save">
          <span>write the quantized checkpoint to disk</span></label>
      </div>

      <div class="q-actions">
        <button id="q-run" type="button">Quantize</button>
        <button id="q-compare" class="ghost" type="button"
                title="every method and group size on one table, against the bf16 baseline">Compare all</button>
        <button id="q-stop" class="ghost" type="button" hidden>Stop</button>
      </div>
      <div class="q-hint" id="q-cmd"></div>
    </aside>

    <section class="panel quant-main">
      <div class="panel-head">
        <h2 id="q-title">Results</h2>
        <span class="panel-note" id="q-state">nothing running</span>
      </div>
      <div id="q-results" class="q-results"></div>
      <div class="q-logwrap">
        <div class="panel-head"><h2>Job output</h2>
          <span class="panel-note">live, from <code>logs/quant/</code></span></div>
        <pre id="q-log" class="q-log">Pick a checkpoint and press Quantize.</pre>
      </div>
    </section>

  </section>
</div><!-- /view-quant -->
